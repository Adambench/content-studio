# The Android app (mobile/). A v* tag builds a signed release APK and attaches it to a GitHub release, which
# Obtainium installs and updates from. Every push to main builds a debug APK as a workflow artifact.
name: Android app

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the release

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Only the web UI and the Android project are built here.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: '1'
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$RELEASE" = true ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match package.json ($version). Bump package.json, commit, then tag v$version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Build the web UI for the app
        run: npm run build:app -w web

      - name: Copy it into the Android project
        working-directory: mobile
        run: npx cap sync android

      - name: Debug APK
        if: env.RELEASE != 'true'
        working-directory: mobile/android
        run: |
          ./gradlew --no-daemon assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/content-studio-${{ steps.version.outputs.version }}-${GITHUB_SHA::7}-debug.apk"

      - uses: actions/upload-artifact@v7
        if: env.RELEASE != 'true'
        with:
          name: content-studio-debug-apk
          path: ${{ runner.temp }}/*-debug.apk
          retention-days: 14

      - name: Signed release APK
        if: env.RELEASE == 'true'
        working-directory: mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          CS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::The ANDROID_KEYSTORE_* secrets aren't set (see README → Android app)."; exit 1; fi
          export CS_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$CS_KEYSTORE_FILE"
          ./gradlew --no-daemon assembleRelease
          rm "$CS_KEYSTORE_FILE"
          apk="$RUNNER_TEMP/content-studio-${{ steps.version.outputs.version }}.apk"
          mv app/build/outputs/apk/release/app-release.apk "$apk"
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --print-certs "$apk" | head -3
          echo "APK=$apk" >> "$GITHUB_ENV"

      - name: GitHub release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$APK" --title "Content Studio ${{ steps.version.outputs.version }}" --generate-notes
